; Life-Fi firmware: ESP32 CSI capture + on-device presence / people-count
; estimate, logged to the serial console.
;
;   pio run -e esp32dev -t upload        classic ESP32 dev board
;   pio run -e esp32s3 -t upload         ESP32-S3 DevKitC
;   pio device monitor                   console (type "help" for commands)

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.12.0
framework = espidf
monitor_speed = 921600
monitor_echo = yes
monitor_eol = LF
monitor_filters = direct, esp32_exception_decoder

[env:esp32dev]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1

; AI Thinker ESP32-CAM (classic ESP32; the camera is not used). It has no
; USB of its own: flash through an ESP32-CAM-MB shield or a USB-serial
; adapter. DTR/RTS stay released while monitoring, otherwise the MB shield
; holds the chip in reset or download mode and the console stays silent.
[env:esp32cam]
board = esp32cam
upload_speed = 460800
monitor_rts = 0
monitor_dtr = 0

; Fixed transmitter (docs/hardware/fixed-transmitter.md): ESP-NOW broadcasts
; at 100 Hz for the receiver to take CSI from. Same project, other app_main.
;   pio run -e esp32dev_tx -t upload    any classic ESP32 board (LED on GPIO 2)
;   pio run -e esp32cam_tx -t upload    ESP32-CAM (small red LED on GPIO 33)
[env:esp32dev_tx]
extends = env:esp32dev
build_flags = -DLIFEFI_ROLE_TX=1 -DLIFEFI_TX_LED_GPIO=2

[env:esp32cam_tx]
extends = env:esp32cam
build_flags = -DLIFEFI_ROLE_TX=1 -DLIFEFI_TX_LED_GPIO=33 -DLIFEFI_TX_LED_ACTIVE_LOW=1
