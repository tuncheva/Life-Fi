name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  portal:
    name: contracts + server + ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fixtures validate against the schema
        run: npm run check:contracts
      - name: Generated types are committed and current
        run: |
          node ui/scripts/gen-types.mjs
          git diff --exit-code -- ui/src/lib/contracts.gen.ts server/src/contracts.gen.ts
      - name: Server typecheck + tests
        run: |
          npm run lint -w server
          npm test -w server
      - name: UI lint + typecheck + static export
        run: |
          npm run lint -w ui
          npm run typecheck -w ui
          npm run build -w ui
